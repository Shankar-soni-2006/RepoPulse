# Render blueprint for the RepoPulse API (backend). Secrets are marked sync: false:
# Render asks for them when the blueprint is applied; they are never stored here.
services:
  - type: web
    name: repopulse-api
    runtime: node
    rootDir: backend
    # Dev dependencies (TypeScript) are needed to build even though NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Public origin users visit (the Vercel app). With the /api rewrite this is also
      # the OAuth callback origin: BACKEND_URL = FRONTEND_URL.
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_FALLBACK_API_KEY
        sync: false
      - key: SYNC_LOOKBACK_DAYS
        value: "180"
